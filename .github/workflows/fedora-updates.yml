name: Fedora Updates
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fedora-build-source-v4.zip', '.github/workflows/fedora-updates.yml']
permissions:
  contents: write
concurrency:
  group: fedora-release
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora build tools
        run: dnf install -y git gh python3 unzip cpio rpm-build wget curl binutils tar xz zstd findutils nodejs npm bats desktop-file-utils gnupg2 rpm-sign createrepo_c
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify and unpack build sources
        run: |
          echo '90f04e184521fa271ab6524b3cd03daf16a75ff9b40e26289ca9054f718a6f75  fedora-build-source-v4.zip' | sha256sum -c -
          mkdir source
          unzip -q fedora-build-source-v4.zip -d source
      - name: Run source tests
        working-directory: source
        run: |
          python3 fedora/test_update.py
          python3 fedora/test_icon_install.py
          bats tests/dependencies.bats tests/app-asar.bats tests/official-deb-download.bats tests/launcher-prelaunch-calls.bats
      - name: Check official Claude version
        id: official
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 fedora/update.py
      - name: Build RPM and AppImage
        if: steps.official.outputs.build == 'true'
        working-directory: source
        env:
          GITHUB_ACTIONS: 'false'
          CI: 'true'
        run: |
          echo '%_binary_payload w9.zstdio' > "$HOME/.rpmmacros"
          bash build-fedora.sh --deb "$PWD/official.deb" --arch amd64
      - name: Verify packages
        if: steps.official.outputs.build == 'true'
        working-directory: source
        env:
          VERSION: ${{ steps.official.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          rpm -K ./*.rpm
          test "$(rpm -qp --qf '%{VERSION}' ./*.rpm)" = "$VERSION"
          test "$(rpm -qp --qf '%{ARCH}' ./*.rpm)" = x86_64
          rpm -qplv ./*.rpm | grep -E '^-rwsr-xr-x.* /usr/lib/claude-desktop-unofficial/chrome-sandbox$'
          mkdir ../rpm-check
          rpm2cpio ./*.rpm | (cd ../rpm-check && cpio -idm --quiet)
          desktop-file-validate ../rpm-check/usr/share/applications/claude-desktop-unofficial.desktop
          bash -n ../rpm-check/usr/bin/claude-desktop-unofficial
          test -s ../rpm-check/usr/share/icons/hicolor/256x256/apps/claude-desktop-unofficial.png
          grep -Fx 'Icon=claude-desktop-unofficial' ../rpm-check/usr/share/applications/claude-desktop-unofficial.desktop
          cp ../rpm-check/usr/share/icons/hicolor/256x256/apps/claude-desktop-unofficial.png claude-desktop.png
          cp ../fedora/install-appimage.py install-appimage.py
          sha256sum -- *.rpm *.AppImage claude-desktop.png install-appimage.py > SHA256SUMS
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract-and-run --version | grep -Fx "claude-desktop-unofficial $VERSION"
      - name: Build repository setup RPM
        if: steps.official.outputs.build == 'true'
        working-directory: source
        run: bash fedora/build-repo-package.sh
      - name: Sign RPMs and repository metadata
        if: steps.official.outputs.build == 'true'
        working-directory: source
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          TAG: ${{ steps.official.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RPM_SIGNING_KEY" || { echo 'RPM_SIGNING_KEY secret is required'; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/claude-rpm-signing"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --import
          unset RPM_SIGNING_KEY
          bash fedora/sign-repository.sh
      - name: Publish verified release
        if: steps.official.outputs.build == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.official.outputs.tag }}
          VERSION: ${{ steps.official.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Claude $VERSION für Fedora 44" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.rpm dist/*.AppImage dist/claude-desktop.png dist/install-appimage.py dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Publish signed DNF repository
        if: steps.official.outputs.build == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.official.outputs.tag }}
        run: bash fedora/publish-repository.sh
